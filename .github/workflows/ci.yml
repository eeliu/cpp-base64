name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: C++${{ matrix.standard }} / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [11, 17]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        if: matrix.compiler == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure, build, and test with CMake
        env:
          WARNING_FLAGS: >-
            -Werror
            -Wall
            -Wextra
            -pedantic
            -Wcast-align
            -Wcast-qual
            -Wdisabled-optimization
            -Wformat=2
            -Wmissing-include-dirs
            -Wmissing-declarations
            -Wold-style-cast
            -Woverloaded-virtual
            -Wredundant-decls
            -Wshadow
            -Wsign-promo
            -Wundef
            -Wno-unused
            -Wno-variadic-macros
            -Wno-parentheses
            -fdiagnostics-show-option
          GNU_WARNING_FLAGS: >-
            -Wctor-dtor-privacy
            -Winit-self
            -Wlogical-op
            -Wnoexcept
            -Wstrict-null-sentinel
            -Wstrict-overflow=5
        run: |
          if [[ "${{ matrix.compiler }}" == "g++" ]]; then
            WARNING_FLAGS="$WARNING_FLAGS $GNU_WARNING_FLAGS"
          fi
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
            -DCMAKE_CXX_FLAGS="$WARNING_FLAGS" \
            -DBUILD_TESTING=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
